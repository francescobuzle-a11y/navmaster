# Development of the guidance computed by GraphHopper alone (no Valhalla on the tablet):
# small OSM extracts for the tests on the computer, and Valhalla's answers on the same trips
# (route in OSRM format with Italian voice and banners, trace_attributes) as the reference the
# GraphHopper guidance is compared with. Everything goes to the release "sviluppo".
name: Sviluppo guida GraphHopper

on:
  workflow_dispatch:
    inputs:
      areas:
        description: "Aree di tools/guide/trips.json (es. test,bologna)"
        default: "como,ticino,como+ticino"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  GEOFABRIK: https://download.geofabrik.de/europe
  VALHALLA_IMAGE: ghcr.io/valhalla/valhalla:3.6.3
  GH_VERSION: "11.0"
  VEHICLE_ROADS: motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road,track,busway

jobs:
  ref:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Estratti OSM delle aree
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
          mkdir -p w out && cd w
          T=$GITHUB_WORKSPACE/tools/guide/trips.json
          AREAS="$(echo "${{ inputs.areas }}" | tr ',' ' ')"
          # an area is a box of a country's extract ("como"), or more of them merged ("como+ticino")
          for a in $AREAS; do
            case "$a" in *+*) continue;; esac
            read bbox country < <(python3 -c "import json; x=json.load(open('$T'))['areas']['$a']; print(x if isinstance(x, str) else x['bbox'], 'italy' if isinstance(x, str) else x.get('country', 'italy'))")
            [ -f "src-$country.osm.pbf" ] || curl -fsSL -o "src-$country.osm.pbf" "$GEOFABRIK/$country-latest.osm.pbf"
            osmium extract -b "$bbox" "src-$country.osm.pbf" -o $a.osm.pbf --overwrite
            echo "$country" > $a.country
          done
          for a in $AREAS; do
            case "$a" in *+*) osmium merge $(for p in $(echo $a | tr '+' ' '); do echo $p.osm.pbf; done) -o $a.osm.pbf --overwrite;; esac
          done
          for a in $AREAS; do
            osmium tags-filter $a.osm.pbf w/highway=$VEHICLE_ROADS w/route=ferry r/type=restriction -o $a-roads.osm.pbf --overwrite
            cp $a-roads.osm.pbf ../out/
          done
          rm -f src-*.osm.pbf
          ls -la . ../out
      - name: Valichi (strade che passano il confine, tools/gh/build_crossings.py)
        run: |
          python3 -m pip install --quiet --break-system-packages shapely 2>/dev/null || python3 -m pip install --quiet shapely
          cd w
          mkdir -p poly
          for c in $(python3 -c "import json; print(' '.join(x['id'] for x in json.load(open('$GITHUB_WORKSPACE/data/countries.json'))))"); do
            curl -fsSL -o poly/$c.poly "$GEOFABRIK/$c.poly" || rm -f poly/$c.poly
          done
          ls poly | wc -l
          echo '{"attributes": {"type": false, "id": true}, "include_tags": ["highway", "name", "ref", "oneway", "junction"]}' > cfg.json
          for a in $(echo "${{ inputs.areas }}" | tr ',' ' '); do
            [ -f $a.country ] || continue
            osmium export $a-roads.osm.pbf -c cfg.json -f geojsonseq --geometry-types=linestring \
              --format-option print_record_separator=false -o $a-roads.geojsonseq --overwrite
            python3 $GITHUB_WORKSPACE/tools/gh/build_crossings.py $a-roads.geojsonseq ../out/valichi-$a.json $(cat $a.country) poly
          done
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: Grafo e guida di GraphHopper (GhGuide) sulle aree
        run: |
          cd w
          curl -fsSL -o gh.jar "https://github.com/graphhopper/graphhopper/releases/download/$GH_VERSION/graphhopper-web-$GH_VERSION.jar"
          mkdir -p cls
          javac -nowarn -d cls -cp gh.jar $GITHUB_WORKSPACE/app/src/main/java/app/navmaster/truck/routing/gh/*.java \
            $GITHUB_WORKSPACE/tools/gh/NmImport.java $GITHUB_WORKSPACE/tools/guide/GuideRun.java
          for a in $(echo "${{ inputs.areas }}" | tr ',' ' '); do
            java -Xmx6g -cp gh.jar:cls NmImport $a-roads.osm.pbf g-$a $GITHUB_WORKSPACE/app/src/main/assets/gh 2>&1 | grep NMIMPORT || true
            java -Xmx6g -cp gh.jar:cls GuideRun g-$a $GITHUB_WORKSPACE/app/src/main/assets/gh $GITHUB_WORKSPACE/tools/guide/trips.json $a ../out/gh 2>&1 | grep -vE "INFO|DEBUG" || true
          done
      - name: Risposte di Valhalla sui viaggi di prova
        run: |
          docker pull -q "$VALHALLA_IMAGE"
          cd w
          for a in $(echo "${{ inputs.areas }}" | tr ',' ' '); do
            python3 -c "import json,sys; sys.exit(0 if any(t['area'] == '$a' for t in json.load(open('$GITHUB_WORKSPACE/tools/guide/trips.json'))['trips']) else 1)" || continue
            mkdir -p v-$a && cp $a.osm.pbf v-$a/region.osm.pbf && cp $a-roads.osm.pbf v-$a/roads.osm.pbf
            docker run --rm -v "$PWD/v-$a:/data" "$VALHALLA_IMAGE" bash -c "
              set -e; cd /data
              valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-tile-extract /data/valhalla_tiles.tar \
                --mjolnir-admin /data/admins.sqlite > valhalla.json
              valhalla_build_admins -c valhalla.json /data/region.osm.pbf
              valhalla_build_tiles -c valhalla.json /data/roads.osm.pbf
              valhalla_build_extract -c valhalla.json -v --overwrite"
            sudo chmod -R a+rwX v-$a
            docker run -d --name vh-${a//+/_} -p 8002:8002 -v "$PWD/v-$a:/data" "$VALHALLA_IMAGE" valhalla_service /data/valhalla.json 1
            sleep 8
            python3 $GITHUB_WORKSPACE/tools/guide/vhref.py $GITHUB_WORKSPACE/tools/guide/trips.json $a ../out/vh
            # Valhalla's guidance along GraphHopper's own paths: the manoeuvres compared one by one
            python3 $GITHUB_WORKSPACE/tools/guide/vhref.py --trace ../out/gh $a $GITHUB_WORKSPACE/tools/guide/trips.json ../out/vhtrace
            docker rm -f vh-${a//+/_}
          done
          cd ../out && zip -qr vh-ref.zip vh gh vhtrace && ls -la
      - name: Nella release «sviluppo»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          gh release view sviluppo -R "$R" >/dev/null 2>&1 || gh release create sviluppo -R "$R" --prerelease \
            --title "Sviluppo (file di prova)" --notes "Estratti OSM e risposte di riferimento per lo sviluppo. Dati © OpenStreetMap contributors (ODbL)."
          gh release upload sviluppo out/*.osm.pbf out/vh-ref.zip out/valichi-*.json -R "$R" --clobber
