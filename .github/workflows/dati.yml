# Offline data packages for the tablet, one per European country (plus a small test area used by
# the emulator): vector map, routing graph, heavy-vehicle limits, POI, address book and the
# physical difficulties of the roads (narrow, rough, steep, tight curves).
#
# Every package is published on a fixed release tag (dati-<country>) with a manifest.json; files
# over GitHub's 2 GB limit are split into parts that the app joins. catalogo.yml then rebuilds the
# list of countries the app shows.
name: Dati offline

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Paesi separati da virgola (es. romania,italy,test) oppure europa"
        default: "romania,italy,test"
  schedule:
    - cron: "0 2 1 * *"   # every month, all of Europe

permissions:
  contents: write
  actions: write

env:
  PLANETILER: https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
  GO_PMTILES: https://github.com/protomaps/go-pmtiles/releases/download/v1.28.0/go-pmtiles_1.28.0_Linux_x86_64.tar.gz
  GEOFABRIK: https://download.geofabrik.de/europe
  TEST_BBOX: "12.30,43.85,12.72,44.12"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.m.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - "${{ github.event.inputs.region || 'europa' }}" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          want = sys.argv[1].strip().lower()
          countries = [c["id"] for c in json.load(open("data/countries.json"))]
          if want in ("europa", "tutti", "all"):
              sel = countries + ["test"]
          else:
              sel = [x.strip() for x in want.split(",") if x.strip() and (x.strip() in countries or x.strip() == "test")]
          print("regions=" + json.dumps(sel))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # 20 jobs at once is the account limit: leave room for the app build and the unpacking
      max-parallel: 15
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
        part: [mappa, dati]
    steps:
      - name: Libera spazio sul disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          df -h / /mnt
      - uses: actions/checkout@v4
      - name: Estratto OSM
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
          if [ "${{ matrix.region }}" = "test" ]; then
            curl -fsSL -o src.osm.pbf "$GEOFABRIK/italy-latest.osm.pbf"
            osmium extract -b "$TEST_BBOX" src.osm.pbf -o region.osm.pbf --overwrite
            rm src.osm.pbf
          else
            curl -fsSL -o region.osm.pbf "$GEOFABRIK/${{ matrix.region }}-latest.osm.pbf"
          fi
          ls -la region.osm.pbf
          echo "PBF_MB=$(( $(stat -c%s region.osm.pbf) / 1000000 ))" >> $GITHUB_ENV
          mkdir -p out

      # ------------------------------------------------------------------ map (vector tiles)
      - uses: actions/setup-java@v4
        if: matrix.part == 'mappa'
        with: {distribution: temurin, java-version: "21"}
      - name: Mappa vettoriale (Planetiler → PMTiles)
        if: matrix.part == 'mappa'
        run: |
          curl -fsSL -o planetiler.jar "$PLANETILER"
          HEAP=$([ "$PBF_MB" -gt 1500 ] && echo 12g || echo 5g)
          # without the layers the app does not draw (peaks, house numbers, airports), then only the
          # classes the style shows (data/slim_tiles.py), then PMTiles for the tablet
          java -Xmx$HEAP -jar planetiler.jar --osm-path=region.osm.pbf --output=mappa.mbtiles \
            --download --force --languages=it,en,ro,de,fr --maxzoom=14 --nodemap-type=sparsearray --storage=mmap \
            --exclude-layers=mountain_peak,housenumber,aeroway,aerodrome_label
          python3 data/slim_tiles.py mappa.mbtiles
          curl -fsSL "$GO_PMTILES" | tar -xzf - pmtiles
          ./pmtiles convert mappa.mbtiles out/mappa.pmtiles
          rm -f mappa.mbtiles
          ls -la out

      # ------------------------------------------------------------------ everything else
      - name: Limiti mezzi pesanti (sottopassi, ponti, divieti, gallerie ADR)
        if: matrix.part == 'dati'
        run: |
          osmium tags-filter region.osm.pbf \
            nwr/maxheight nwr/maxheight:physical nwr/maxweight nwr/maxweightrating nwr/maxwidth nwr/maxlength \
            nwr/maxaxleload n/highway=speed_camera w/hgv w/hazmat w/hazmat:water w/motorhome w/bus w/psv \
            w/hgv:conditional w/maxweight:conditional w/goods:conditional \
            w/hazmat:adr_tunnel_cat w/hazmat:tunnel_cat w/tunnel:adr_category w/hazmat:B w/hazmat:C w/hazmat:D w/hazmat:E \
            -o limits.osm.pbf --overwrite
          osmium export limits.osm.pbf -f geojsonseq --add-unique-id=type_id \
            --format-option print_record_separator=false -o limits.geojsonseq --overwrite
          python3 data/build_limits.py limits.geojsonseq out/limiti.sqlite "${{ matrix.region }}"
          rm -f limits.osm.pbf limits.geojsonseq
      - name: Punti di interesse per camion, bus e camper
        if: matrix.part == 'dati'
        run: |
          osmium tags-filter region.osm.pbf \
            nwr/amenity=fuel,parking,restaurant,fast_food,cafe,toilets,shower,car_wash,weighbridge,atm,bank,pharmacy,hospital,sanitary_dump_station,charging_station \
            nwr/highway=rest_area,services nwr/shop=supermarket,tyres,truck_repair,car_repair \
            nwr/tourism=hotel,motel,caravan_site nwr/barrier=border_control nwr/craft=truck_repair \
            -o poi.osm.pbf --overwrite
          osmium export poi.osm.pbf -f geojsonseq --add-unique-id=type_id \
            --format-option print_record_separator=false -o poi.geojsonseq --overwrite
          python3 data/build_poi.py poi.geojsonseq out/poi.sqlite "${{ matrix.region }}"
          # more places from Overture Maps where OpenStreetMap has none (never blocks the package)
          python3 -m pip install --quiet --break-system-packages duckdb || python3 -m pip install --quiet duckdb || true
          timeout 1500 python3 data/merge_overture.py out/poi.sqlite "${{ matrix.region }}" || true
          rm -f poi.osm.pbf poi.geojsonseq
      - name: Strade (per indirizzi e criticità)
        if: matrix.part == 'dati'
        run: |
          cat > roads-cfg.json <<'EOF'
          {"attributes": {"type": false, "id": true},
           "include_tags": ["highway", "name", "ref", "width", "width:carriageway", "est_width", "lanes", "oneway",
                            "junction", "surface", "smoothness", "tracktype", "incline", "narrow", "ford", "service",
                            "hgv", "maxspeed"]}
          EOF
          osmium tags-filter region.osm.pbf w/highway -o roads.osm.pbf --overwrite
          osmium export roads.osm.pbf -c roads-cfg.json -f geojsonseq --geometry-types=linestring \
            --add-unique-id=type_id --format-option print_record_separator=false -o roads.geojsonseq --overwrite
          rm -f roads.osm.pbf
          ls -la roads.geojsonseq
      - name: Criticità fisiche (strade strette, dissestate, ripide, curve e svincoli stretti)
        if: matrix.part == 'dati'
        run: python3 data/build_critical.py roads.geojsonseq out/criticita.sqlite "${{ matrix.region }}"
      - name: Valichi (strade che passano il confine, per unire i grafi GraphHopper dei Paesi)
        if: matrix.part == 'dati' && matrix.region != 'test'
        run: |
          python3 -m pip install --quiet --break-system-packages shapely 2>/dev/null || python3 -m pip install --quiet shapely
          mkdir -p poly
          for c in $(python3 -c "import json; print(' '.join(x['id'] for x in json.load(open('data/countries.json'))))"); do
            curl -fsSL -o poly/$c.poly "$GEOFABRIK/$c.poly" || rm -f poly/$c.poly
          done
          ls poly | wc -l
          python3 tools/gh/build_crossings.py roads.geojsonseq out/valichi.json "${{ matrix.region }}" poly \
            || echo "valichi non calcolati per ${{ matrix.region }}"
          rm -rf poly
      - name: Indirizzi (Paese → città → via → civico)
        if: matrix.part == 'dati'
        run: |
          python3 -m pip install --quiet --break-system-packages shapely 2>/dev/null || python3 -m pip install --quiet shapely
          osmium tags-filter region.osm.pbf nwr/place=city,town,village,hamlet,suburb,quarter,isolated_dwelling -o places.osm.pbf --overwrite
          osmium export places.osm.pbf -f geojsonseq --format-option print_record_separator=false -o places.geojsonseq --overwrite
          osmium tags-filter region.osm.pbf nwr/addr:housenumber -o addr.osm.pbf --overwrite
          cat > addr-cfg.json <<'EOF'
          {"attributes": {"type": false, "id": false},
           "include_tags": ["addr:housenumber", "addr:street", "addr:place", "addr:city"]}
          EOF
          osmium export addr.osm.pbf -c addr-cfg.json -f geojsonseq --format-option print_record_separator=false -o addr.geojsonseq --overwrite
          osmium tags-filter region.osm.pbf r/admin_level=4 -o admin.osm.pbf --overwrite
          osmium export admin.osm.pbf -f geojsonseq --geometry-types=polygon --format-option print_record_separator=false -o admin.geojsonseq --overwrite
          python3 data/build_addresses.py places.geojsonseq roads.geojsonseq addr.geojsonseq admin.geojsonseq out/indirizzi.sqlite "${{ matrix.region }}"
          rm -f places.* addr.* admin.* roads.geojsonseq
      - name: Dividi i file oltre 1,9 GB
        run: |
          cd out
          for f in *; do
            if [ "$(stat -c%s "$f")" -gt 1990000000 ]; then
              split -b 1900m -d -a 2 "$f" "$f.part"
              rm "$f"
            fi
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: "out-${{ matrix.region }}-${{ matrix.part }}"
          path: out/*
          retention-days: 3
          compression-level: 0

  publish:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "out-${{ matrix.region }}-*"
          merge-multiple: true
          path: pkg
      - name: Manifesto del pacchetto
        id: man
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the GraphHopper data of the country (made by grafo-gh.yml) stay in the package
          gh release download "dati-${{ matrix.region }}" -R "${{ github.repository }}" -p manifest.json -D old 2>/dev/null || true
          # a package is published only when map and limits are there (the routing graph is GraphHopper)
          have() { ls pkg/$1* >/dev/null 2>&1; }
          if ! have mappa.pmtiles || ! have limiti.sqlite; then echo "none=1" >> $GITHUB_OUTPUT; ls -la pkg || true; exit 0; fi
          python3 - <<'PY'
          import hashlib, json, os, re, time
          region = "${{ matrix.region }}"
          names = {c["id"]: c["name"] for c in json.load(open("data/countries.json"))}
          groups = {}
          for f in sorted(os.listdir("pkg")):
              groups.setdefault(re.sub(r"\.part\d+$", "", f), []).append(f)
          items = []
          for base, parts in sorted(groups.items()):
              plist, total = [], 0
              for p in sorted(parts):
                  path = os.path.join("pkg", p)
                  h = hashlib.sha256()
                  with open(path, "rb") as fh:
                      for chunk in iter(lambda: fh.read(1 << 20), b""):
                          h.update(chunk)
                  size = os.path.getsize(path)
                  total += size
                  plist.append({"name": p, "size": size, "sha256": h.hexdigest()})
              items.append({"file": base, "size": total, "parts": plist})
          gh_keep, gh_version = [], ""
          if os.path.exists("old/manifest.json"):
              old = json.load(open("old/manifest.json"))
              gh_keep = [f for f in old.get("files", []) if f["file"] in ("gh.tar.gz", "gh-camion.tar.gz", "gh-auto.tar.gz")]
              gh_version = old.get("graphhopper", "")
          items += gh_keep
          manifest = {"region": region, "label": names.get(region, "Prova Rimini / San Marino"),
                      "built": time.strftime("%Y-%m-%d"), "valhalla": "3.6.3", "format": 2, "files": items}
          if gh_keep:
              manifest["graphhopper"] = gh_version
          json.dump(manifest, open("pkg/manifest.json", "w"), indent=1)
          print(json.dumps(manifest, indent=1))
          PY
      - name: Pubblica il pacchetto (release dati-${{ matrix.region }})
        if: steps.man.outputs.none != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dati-${{ matrix.region }}"
          R="${{ github.repository }}"
          if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            # the release stays: the GraphHopper files (grafo-gh.yml) are kept, the other old files go
            for a in $(gh release view "$TAG" -R "$R" --json assets -q '.assets[].name'); do
              case "$a" in gh.tar.gz*|gh-camion.tar.gz*|gh-auto.tar.gz*) continue ;; esac
              [ -f "pkg/$a" ] || gh release delete-asset "$TAG" "$a" -R "$R" --yes
            done
            gh release upload "$TAG" pkg/* -R "$R" --clobber
            gh release edit "$TAG" -R "$R" --title "Dati offline ${{ matrix.region }} $(date +%Y-%m-%d)"
          else
            gh release create "$TAG" pkg/* -R "$R" --title "Dati offline ${{ matrix.region }} $(date +%Y-%m-%d)" \
              --notes "Mappa (PMTiles), valichi, limiti, POI, indirizzi e criticità per mezzi pesanti. Dati © OpenStreetMap contributors (ODbL)." \
              --latest=false
          fi

  catalog:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggiorna il catalogo dei Paesi
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalogo.yml --repo "${{ github.repository }}" --ref main
