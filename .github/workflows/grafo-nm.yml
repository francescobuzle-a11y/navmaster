# The engine graphs for the tablet (navmaster-engine, openrouteservice's logic from scratch), one per
# country (plus the small test area), added to the country's package (release dati-<country>, file
# nm.tar.gz in the manifest). The app computes the route with them, offline, with the measures of
# the vehicle (app/src/main/java/.../routing/NmEngine.kt). The graph holds both profiles
# (driving-hgv, driving-car), their Contraction Hierarchies, the "core" for the requests with
# restrictions and its landmarks, and the guidance data (speed limits, lanes, signs, tolls).
name: Grafo motore NavMaster

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Paesi separati da virgola (es. test,italy)"
        default: "test"
      engine_ref:
        description: "Ramo o tag di navmaster-engine"
        default: "main"
  push:
    branches: [main]
    paths: [".github/workflows/grafo-nm.yml"]

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

env:
  GEOFABRIK: https://download.geofabrik.de/europe
  TEST_BBOX: "12.30,43.85,12.72,44.12"
  ENGINE_REPO: francescobuzle-a11y/navmaster-engine
  # the roads a vehicle can drive on (the engine's profiles decide the rest)
  VEHICLE_ROADS: motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road,track,busway

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.p.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          want = "${{ inputs.regions }}" or "test"
          ids = {c["id"] for c in json.load(open("data/countries.json"))}
          sel = [x.strip() for x in want.split(",") if x.strip() in ids or x.strip() == "test"]
          print("regions=" + json.dumps(sel or ["test"]))
          PY

  graph:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    steps:
      - name: Spazio sul disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo mkdir -p /mnt/w && sudo chown $USER /mnt/w
          df -h / /mnt; free -g
      - uses: actions/checkout@v4
      - name: Motore (navmaster-engine)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ inputs.engine_ref || 'main' }}
          path: engine
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Compila il motore
        working-directory: engine
        run: |
          ./gradlew :engine-cli:installDist -q
          ENGINE_VERSION=$(grep -oE 'VERSION = "[^"]+"' engine-core/src/main/kotlin/it/navmaster/engine/Engine.kt | cut -d'"' -f2)
          echo "ENGINE_VERSION=$ENGINE_VERSION" >> $GITHUB_ENV
          echo "motore $ENGINE_VERSION"
      - name: Estratto OSM (solo strade per veicoli, traghetti, divieti di svolta)
        working-directory: /mnt/w
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
          if [ "${{ matrix.region }}" = "test" ]; then
            curl -fsSL -o src.osm.pbf "$GEOFABRIK/italy-latest.osm.pbf"
            osmium extract -b "$TEST_BBOX" src.osm.pbf -o region.osm.pbf --overwrite
          else
            curl -fsSL -o src.osm.pbf "$GEOFABRIK/${{ matrix.region }}-latest.osm.pbf"
            mv src.osm.pbf region.osm.pbf
          fi
          rm -f src.osm.pbf
          osmium tags-filter region.osm.pbf w/highway=$VEHICLE_ROADS w/route=ferry,shuttle_train r/type=restriction \
            -o roads.osm.pbf --overwrite
          rm region.osm.pbf
          ls -la
      - name: Grafo del motore (import, CH, core, landmark, dati di guida)
        working-directory: /mnt/w
        run: |
          MEM=$(( $(free -g | awk '/Mem:/{print $2}') - 2 ))
          # the big countries: the graph files on disk (memory-mapped) instead of in RAM
          MMAP=""
          case "${{ matrix.region }}" in germany|france|great-britain|poland|spain|turkey|ukraine|italy|sweden|norway|finland) MMAP="--mmap" ;; esac
          date; JAVA_OPTS="-Xmx${MEM}g" $GITHUB_WORKSPACE/engine/engine-cli/build/install/engine-cli/bin/engine-cli import roads.osm.pbf nm $MMAP 2>&1 | tail -40; date
          test -f nm/profiles && test -f nm/edges && test -f nm/guidance
          rm -f roads.osm.pbf
          du -sh nm; ls -la nm
      - name: Prova del grafo con il motore
        working-directory: /mnt/w
        run: |
          case "${{ matrix.region }}" in
            test) P="44.0597,12.5653 43.9360,12.4460" ;;
            italy) P="45.4642,9.1900 41.9028,12.4964" ;;
            *) P="" ;;
          esac
          if [ -n "$P" ]; then
            $GITHUB_WORKSPACE/engine/engine-cli/build/install/engine-cli/bin/engine-cli route nm $P --height=4 --weight=40 2>&1 | tail -20
          fi
          $GITHUB_WORKSPACE/engine/engine-cli/build/install/engine-cli/bin/engine-cli info nm 2>&1 | tail -20
      - name: Pacchetto (nm.tar.gz)
        working-directory: /mnt/w
        run: |
          mkdir -p pub
          tar -C nm -cf - . | gzip -6 > pub/nm.tar.gz
          if [ $(stat -c%s pub/nm.tar.gz) -gt 1900000000 ]; then
            split -b 1900000000 -d -a 1 pub/nm.tar.gz pub/nm.tar.gz.part && rm pub/nm.tar.gz
          fi
          ls -la pub
      - name: Nel pacchetto del Paese (release dati-${{ matrix.region }})
        working-directory: /mnt/w
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dati-${{ matrix.region }}"
          R="${{ github.repository }}"
          if ! gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$R" --title "Dati offline ${{ matrix.region }}" --notes "Grafo del motore NavMaster. Dati © OpenStreetMap contributors (ODbL)." --latest=false
          fi
          # the manifest of the country; when it is missing (a publication cut off by an error of
          # GitHub), it is made again from the files of the release, downloaded and checked here
          if ! gh release download "$TAG" -R "$R" -p manifest.json -D old; then
            echo "manifest.json missing: made again from the files of the release"
            mkdir -p old/files
            for a in $(gh release view "$TAG" -R "$R" --json assets -q '.assets[].name' | grep -vE '^(manifest\.json|nm\.tar\.gz(\.part[0-9]+)?|gh(-camion|-auto)?\.tar\.gz(\.part[0-9]+)?)$' || true); do
              gh release download "$TAG" -R "$R" -p "$a" -D old/files
            done
            REGION="${{ matrix.region }}" python3 - <<'PY'
          import hashlib, json, os, re, time
          region = os.environ["REGION"]
          label = next((c["name"] for c in json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "data/countries.json"))) if c["id"] == region), region)
          d = "old/files"
          groups = {}
          for p in sorted(os.listdir(d)):
              groups.setdefault(re.sub(r"\.part[0-9]+$", "", p), []).append(p)
          files = []
          for n, ps in sorted(groups.items()):
              parts = []
              for p in ps:
                  h = hashlib.sha256()
                  with open(os.path.join(d, p), "rb") as fh:
                      for chunk in iter(lambda: fh.read(1 << 20), b""):
                          h.update(chunk)
                  parts.append({"name": p, "size": os.path.getsize(os.path.join(d, p)), "sha256": h.hexdigest()})
              files.append({"file": n, "size": sum(x["size"] for x in parts), "parts": parts})
          m = {"region": region, "label": label, "built": time.strftime("%Y-%m-%d"), "routing": "navmaster", "format": 3, "files": files}
          json.dump(m, open("old/manifest.json", "w"), indent=1)
          print("manifest made again:", [f["file"] for f in files])
          PY
            rm -rf old/files
          fi
          python3 - <<'PY'
          import hashlib, json, os
          m = json.load(open("old/manifest.json"))
          old_routing = ["gh.tar.gz", "gh-camion.tar.gz", "gh-auto.tar.gz", "valichi.json", "percorsi.tar"]
          m["files"] = [f for f in m["files"] if f["file"] != "nm.tar.gz" and f["file"] not in old_routing]
          parts = []
          for p in sorted(os.listdir("pub")):
              if p != "nm.tar.gz" and not p.startswith("nm.tar.gz.part"):
                  continue
              h = hashlib.sha256()
              with open(os.path.join("pub", p), "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              parts.append({"name": p, "size": os.path.getsize(os.path.join("pub", p)), "sha256": h.hexdigest()})
          m["files"].append({"file": "nm.tar.gz", "size": sum(p["size"] for p in parts), "parts": parts})
          m["routing"] = "navmaster"
          m["format"] = 3
          m["engine"] = os.environ.get("ENGINE_VERSION", "")
          m.pop("graphhopper", None)
          json.dump(m, open("pub/manifest.json", "w"), indent=1)
          print(json.dumps(m, indent=1))
          PY
          # the routing data of the older versions, and the pieces of a previous graph not in the new one
          for a in $(gh release view "$TAG" -R "$R" --json assets -q '.assets[].name' | grep -E '^(nm\.tar\.gz(\.part[0-9]+)?|gh(-camion|-auto)?\.tar\.gz(\.part[0-9]+)?|valichi\.json|percorsi\.tar)$' || true); do
            [ -f "pub/$a" ] || gh release delete-asset "$TAG" "$a" -R "$R" --yes
          done
          # GitHub sometimes answers 500 halfway through: tried again, manifest.json last (the
          # tablet reads it to know what is there, so it goes up only when the files are there)
          ok=""
          for t in 1 2 3 4; do
            if gh release upload "$TAG" $(ls pub/* | grep -v '/manifest\.json$') -R "$R" --clobber && gh release upload "$TAG" pub/manifest.json -R "$R" --clobber; then ok=1; break; fi
            echo "upload failed (attempt $t), again in $((t * 30)) s"; sleep $((t * 30))
          done
          [ -n "$ok" ]

  after:
    needs: [plan, graph]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Catalogo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalogo.yml --repo "${{ github.repository }}" --ref main || true
