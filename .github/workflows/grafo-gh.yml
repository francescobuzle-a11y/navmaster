# GraphHopper graphs for the tablet, one per country (plus the small test area), added to the
# country's package (release dati-<country>, file gh.tar.gz in the manifest). The app computes the
# route with them, offline, with the measures of the vehicle (app/src/main/java/.../routing/gh).
# The graph is built with the same base model and settings the app opens it with (GhEngine), then
# checked on the runner with the app's own routing code before it is published.
name: Grafo GraphHopper

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Paesi separati da virgola (es. test,italy)"
        default: "test"
      preview:
        description: "Dopo il grafo di prova, anteprima dell'app sull'emulatore"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/grafo-gh.yml"]

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

env:
  GEOFABRIK: https://download.geofabrik.de/europe
  TEST_BBOX: "12.30,43.85,12.72,44.12"
  GH_VERSION: "11.0"
  # the roads a lorry, a bus or a camper can drive on (as for the Valhalla graphs)
  VEHICLE_ROADS: motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road,track,busway

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.p.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> $GITHUB_OUTPUT
          import json
          want = "${{ inputs.regions }}" or "test"
          ids = {c["id"] for c in json.load(open("data/countries.json"))}
          sel = [x.strip() for x in want.split(",") if x.strip() in ids or x.strip() == "test"]
          print("regions=" + json.dumps(sel or ["test"]))
          PY

  graph:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    steps:
      - name: Spazio sul disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo mkdir -p /mnt/w && sudo chown $USER /mnt/w
          df -h / /mnt; free -g
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: Estratto OSM (solo strade per veicoli, traghetti, divieti di svolta)
        working-directory: /mnt/w
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
          if [ "${{ matrix.region }}" = "test" ]; then
            curl -fsSL -o src.osm.pbf "$GEOFABRIK/italy-latest.osm.pbf"
            osmium extract -b "$TEST_BBOX" src.osm.pbf -o region.osm.pbf --overwrite
          else
            curl -fsSL -o src.osm.pbf "$GEOFABRIK/${{ matrix.region }}-latest.osm.pbf"
            mv src.osm.pbf region.osm.pbf
          fi
          rm -f src.osm.pbf
          osmium tags-filter region.osm.pbf w/highway=$VEHICLE_ROADS w/route=ferry r/type=restriction \
            -o roads.osm.pbf --overwrite
          rm region.osm.pbf
          ls -la
      - name: Grafo GraphHopper ${{ env.GH_VERSION }} con le regole di openrouteservice
        working-directory: /mnt/w
        run: |
          curl -fsSL -o gh.jar "https://github.com/graphhopper/graphhopper/releases/download/$GH_VERSION/graphhopper-web-$GH_VERSION.jar"
          mkdir -p cls
          javac -nowarn -d cls -cp gh.jar $GITHUB_WORKSPACE/app/src/main/java/app/navmaster/truck/routing/gh/*.java \
            $GITHUB_WORKSPACE/tools/gh/NmImport.java $GITHUB_WORKSPACE/tools/gh/GhCheck.java $GITHUB_WORKSPACE/tools/gh/GhSame.java
          # the profiles and settings of GhEngine (as on the tablet), openrouteservice's driving-hgv and
          # driving-car rules worked out from the OSM tags (tools/gh/NmImport.java)
          MEM=$(( $(free -g | awk '/Mem:/{print $2}') - 2 ))
          DA=RAM_STORE
          case "${{ matrix.region }}" in germany|france|great-britain|poland|spain|turkey|russia) DA=MMAP; MEM=$(( MEM - 4 )) ;; esac
          date; java -Xmx${MEM}g -Dnm.dataaccess=$DA -cp gh.jar:cls NmImport roads.osm.pbf gh $GITHUB_WORKSPACE/app/src/main/assets/gh 2>&1 | grep -vE "DEBUG" | tail -40; date
          test -f gh/properties
          rm -f roads.osm.pbf
          du -sh gh; ls -la gh
      - name: Prova con il codice dell'app (senza Janino, come sul tablet) e pesi uguali a GraphHopper
        working-directory: /mnt/w
        run: |
          cp gh.jar nojan.jar && zip -q -d nojan.jar 'org/codehaus/*'
          M=$GITHUB_WORKSPACE/app/src/main/assets/gh
          case "${{ matrix.region }}" in
            test) TRIPS="44.0597,12.5653;43.9360,12.4460" ;;
            italy) TRIPS="43.5530,11.5060;45.3697,10.2167|45.4642,9.1900;41.9028,12.4964|46.4983,11.3548;40.8518,14.2681|43.7696,11.2558;43.7228,10.4017|44.0597,12.5653;43.9360,12.4460" ;;
            *) TRIPS=$(python3 -c "import json; print(json.load(open('$GITHUB_WORKSPACE/tools/gh/trips.json')).get('${{ matrix.region }}', '-'))") ;;
          esac
          echo "TRIPS=$TRIPS"
          java -Xmx6g -cp nojan.jar:cls GhCheck gh $M "$TRIPS" 2>&1 | grep -v DEBUG | grep GHCHECK
          if [ "$TRIPS" != "-" ]; then java -Xmx6g -cp gh.jar:cls GhSame gh $M "$TRIPS" 2>&1 | grep GHSAME; fi
      - name: Pacchetti (grafo gh.tar.gz, landmark dei camion gh-camion.tar.gz e degli altri mezzi gh-auto.tar.gz)
        working-directory: /mnt/w
        run: |
          rm -f gh/*.lock
          mkdir -p pub
          # the tablet downloads the graph and only the landmarks of the vehicles the driver chose
          pack() {
            local n=$1; shift
            tar -C gh -cf - "$@" | gzip -6 > pub/$n
            if [ $(stat -c%s pub/$n) -gt 1900000000 ]; then
              split -b 1900000000 -d -a 1 pub/$n pub/$n.part && rm pub/$n
            fi
          }
          pack gh.tar.gz $(ls -A gh | grep -v '^landmarks')
          pack gh-camion.tar.gz $(ls gh | grep -E '^landmarks.*_nm_truck')
          pack gh-auto.tar.gz $(ls gh | grep -E '^landmarks.*_nm_car')
          ls -la pub
      - name: Nel pacchetto del Paese (release dati-${{ matrix.region }})
        working-directory: /mnt/w
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dati-${{ matrix.region }}"
          R="${{ github.repository }}"
          gh release download "$TAG" -R "$R" -p manifest.json -D old
          python3 - <<'PY'
          import hashlib, json, os
          m = json.load(open("old/manifest.json"))
          names = ["gh.tar.gz", "gh-camion.tar.gz", "gh-auto.tar.gz"]
          m["files"] = [f for f in m["files"] if f["file"] not in names]
          for n in names:
              parts = []
              for p in sorted(os.listdir("pub")):
                  if p != n and not p.startswith(n + ".part"):
                      continue
                  h = hashlib.sha256()
                  with open(os.path.join("pub", p), "rb") as fh:
                      for chunk in iter(lambda: fh.read(1 << 20), b""):
                          h.update(chunk)
                  parts.append({"name": p, "size": os.path.getsize(os.path.join("pub", p)), "sha256": h.hexdigest()})
              m["files"].append({"file": n, "size": sum(p["size"] for p in parts), "parts": parts})
          m["graphhopper"] = os.environ["GH_VERSION"]
          json.dump(m, open("pub/manifest.json", "w"), indent=1)
          print(json.dumps(m, indent=1))
          PY
          # old pieces of a previous graph that are not in the new one
          for a in $(gh release view "$TAG" -R "$R" --json assets -q '.assets[].name' | grep -E '^gh(-camion|-auto)?\.tar\.gz(\.part[0-9]+)?$' || true); do
            [ -f "pub/$a" ] || gh release delete-asset "$TAG" "$a" -R "$R" --yes
          done
          gh release upload "$TAG" pub/* -R "$R" --clobber

  after:
    needs: [plan, graph]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Catalogo e anteprima
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run catalogo.yml --repo "${{ github.repository }}" --ref main || true
          if [ "${{ inputs.preview }}" != "false" ] && [ "${{ needs.graph.result }}" = "success" ] && echo '${{ needs.plan.outputs.regions }}' | grep -q '"test"'; then
            gh workflow run app.yml --repo "${{ github.repository }}" --ref main -f preview=true
          fi
