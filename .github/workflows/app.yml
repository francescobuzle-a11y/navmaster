# Builds the NavMaster APK, publishes it as a release (app-N) and runs it on an Android
# emulator with the small offline test package, adding the screenshots to the release.
name: App Android

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "data/**", ".github/workflows/dati.yml", "inbox/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "9.2.1"}

      - name: Caratteri per le scritte della mappa (Noto Sans, OFL)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/protomaps/basemaps-assets /tmp/assets
          cd /tmp/assets
          git sparse-checkout set "fonts/Noto Sans Regular" "fonts/Noto Sans Medium" "fonts/Noto Sans Italic"
          G="$GITHUB_WORKSPACE/app/src/main/assets/glyphs"
          mkdir -p "$G"
          for f in Regular Medium Italic; do cp -r "fonts/Noto Sans $f" "$G/NotoSans$f"; done
          cp fonts/OFL.txt "$G/" 2>/dev/null || true
          ls "$GITHUB_WORKSPACE/app/src/main/assets/glyphs"

      - name: Stile mappa (genera e verifica)
        run: |
          python3 data/style/make_style.py app/src/main/assets/style
          npx --yes -p @maplibre/maplibre-gl-style-spec gl-style-validate app/src/main/assets/style/style-day.json app/src/main/assets/style/style-night.json

      - name: Compila APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Pubblica APK (release app-${{ github.run_number }})
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/NavMaster-${{ github.run_number }}.apk
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: NavMaster ${{ github.run_number }}
          body: |
            App NavMaster (MapLibre + Valhalla offline + Ferrostar). Installa l'APK sul tablet.
            Commit: ${{ github.sha }}
          files: out/*.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with: {name: apk, path: out/*.apk, retention-days: 5}

  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: apk, path: out}
      - name: Pacchetto dati di prova
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p testdata
          gh release download dati-test -D testdata || echo "pacchetto di prova non ancora pubblicato"
          ls -la testdata
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulatore (screenshot)
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/preview.sh out testdata shots
      - name: Screenshot nella release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          files: |
            shots/*.png
            shots/*.txt
