# One routing graph for the whole of Europe, so that the tablet can compute routes across borders
# offline. The graph is built once from the European extract reduced to what routing needs (roads,
# ferries, turn restrictions) and then cut into per-country tile packages: tiles all come from the
# same build, so the packages of neighbouring countries join up on the tablet.
name: Grafo Europa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/grafo-europa.yml"]
  schedule:
    - cron: "0 1 3 * *"   # every month, after the country packages

permissions:
  contents: write
  actions: write

env:
  VALHALLA_IMAGE: ghcr.io/valhalla/valhalla:3.6.3
  # only what a lorry, a bus or a camper can drive on: footways, paths, cycleways and steps are
  # half of the European ways and would not fit on the runner's disk
  VEHICLE_ROADS: motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road,track,busway

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Libera spazio (servono ~120 GB tra / e /mnt)
        run: |
          for d in /opt/hostedtoolcache/*; do case "$d" in */Python) ;; *) sudo rm -rf "$d";; esac; done
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker image prune -a -f >/dev/null || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile /swapfile || true
          sudo mkdir -p /mnt/w && sudo chown $USER /mnt/w
          mkdir -p $HOME/big
          sudo fallocate -l 16G $HOME/big/swap && sudo chmod 600 $HOME/big/swap && sudo mkswap $HOME/big/swap && sudo swapon $HOME/big/swap
          df -h / /mnt; free -g; nproc
      - uses: actions/checkout@v4
      - name: Scarica l'Europa e tieni solo ciò che serve al calcolo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
          cd $HOME/big
          date; curl -fsSL -o europe.osm.pbf https://download.geofabrik.de/europe-latest.osm.pbf; date
          ls -la europe.osm.pbf
          # one pass: vehicle roads, ferries, turn restrictions and the national / regional borders
          osmium tags-filter europe.osm.pbf w/highway=$VEHICLE_ROADS w/route=ferry r/type=restriction \
            r/route=road,ferry r/admin_level=2,4 -o /mnt/w/all.osm.pbf --overwrite
          rm europe.osm.pbf
          # private driveways and very rough tracks are no use to a lorry or a camper
          osmium tags-filter -i /mnt/w/all.osm.pbf w/service=driveway,drive-through,emergency_access \
            w/tracktype=grade3,grade4,grade5 -o $HOME/big/roads.osm.pbf --overwrite
          rm /mnt/w/all.osm.pbf
          # "maxheight=default" and the like would read as a zero limit and close roads to lorries
          python3 "$GITHUB_WORKSPACE/data/clean_dims.py" $HOME/big/roads.osm.pbf /mnt/w
          ls -la $HOME/big; date; df -h / /mnt
      - name: Grafo Valhalla dell'Europa
        run: |
          docker pull -q "$VALHALLA_IMAGE"
          docker run --rm -v "$HOME/big:/src" -v /mnt/w:/data "$VALHALLA_IMAGE" bash -c "
            set -e
            valhalla_build_config --mjolnir-tile-dir /data/tiles --mjolnir-admin /data/admins.sqlite \
              --mjolnir-concurrency $(nproc) > /data/valhalla.json
            cd /data
            date; valhalla_build_admins -c /data/valhalla.json /src/roads.osm.pbf
            date; valhalla_build_tiles -c /data/valhalla.json /src/roads.osm.pbf
            date
          "
          sudo rm -f /mnt/w/tiles/*.bin /mnt/w/*.bin
          du -sh /mnt/w/tiles; df -h / /mnt
      - name: Tagli per Paese
        run: |
          python3 -m pip install --quiet --break-system-packages shapely 2>/dev/null || python3 -m pip install --quiet shapely
          rm -f $HOME/big/*.pbf
          curl -fsSL -o index.json https://download.geofabrik.de/index-v1.json
          sudo chown -R $USER /mnt/w/tiles
          python3 data/split_tiles.py /mnt/w/tiles data/countries.json index.json $HOME/big/out 3.6.3
          cd $HOME/big/out
          for f in *.tar; do
            if [ "$(stat -c%s "$f")" -gt 1990000000 ]; then split -b 1900m -d -a 2 "$f" "$f.part"; rm "$f"; fi
          done
          python3 - <<'PY'
          import hashlib, json, os, re
          idx = json.load(open("index.json"))
          for cid, st in idx["countries"].items():
              parts = sorted(f for f in os.listdir(".") if re.fullmatch(rf"tiles-{re.escape(cid)}\.tar(\.part\d+)?", f))
              st["parts"] = []
              for p in parts:
                  h = hashlib.sha256()
                  with open(p, "rb") as fh:
                      for chunk in iter(lambda: fh.read(1 << 20), b""):
                          h.update(chunk)
                  st["parts"].append({"name": p, "size": os.path.getsize(p), "sha256": h.hexdigest()})
          json.dump(idx, open("index.json", "w"), indent=1)
          PY
          ls -la | head -80; du -sh .
      - name: Pubblica (release grafo-europa)
        env:
          GH_TOKEN: ${{ github.token }}
          # the step runs outside the checkout: tell gh which repository
          GH_REPO: ${{ github.repository }}
        run: |
          cd $HOME/big/out
          gh release delete grafo-europa --yes --cleanup-tag 2>/dev/null || true
          gh release create grafo-europa index.json --title "Grafo Europa $(date +%Y-%m-%d)" \
            --notes "Grafo Valhalla 3.6.3 dell'Europa diviso per Paese (percorsi transfrontalieri offline). Dati © OpenStreetMap contributors (ODbL)." \
            --latest=false
          for f in tiles-*; do gh release upload grafo-europa "$f" --clobber; done
          gh workflow run catalogo.yml --repo "${{ github.repository }}" --ref main
