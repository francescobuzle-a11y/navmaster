# Changes arrive as one packed file (inbox/*.b64 = base64 of a .tar.gz, inbox/*.b85 = base85 of a .tar.xz):
# this workflow unpacks it into the repository, applies the diffs in .patches/, commits, and starts
# the builds concerned. Optional control files in the bundle: .dati-regions (regions for dati.yml,
# e.g. "europa"), .run-app (build the app even without app changes).
name: Scompatta pacchetto

on:
  push:
    branches: [main]
    paths: ["inbox/**"]

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Scompatta e committa
        id: u
        run: |
          set -e
          shopt -s nullglob
          files=(inbox/*.b64 inbox/*.b85)
          [ ${#files[@]} -eq 0 ] && { echo "niente da scompattare"; exit 0; }
          msg=""
          for f in "${files[@]}"; do
            case "$f" in
              *.b64) tr -d ' \n\r' < "$f" | base64 -d > /tmp/bundle.bin ;;
              *.b85) python3 -c "import base64,sys; sys.stdout.buffer.write(base64.b85decode(''.join(open(sys.argv[1]).read().split())))" "$f" > /tmp/bundle.bin ;;
            esac
            tar -xf /tmp/bundle.bin -C .   # gzip or xz, recognised by tar
            git rm -q "$f"
          done
          if [ -d .patches ]; then
            for p in .patches/*.diff; do echo "patch $p"; git apply --whitespace=nowarn "$p"; done
            rm -rf .patches
          fi
          regions=$(cat .dati-regions 2>/dev/null | tr -d ' \n' || true)
          runapp=$([ -f .run-app ] && echo 1 || echo 0)
          rm -f .dati-regions .run-app
          if [ -f .delete-list ]; then
            while read -r p; do [ -n "$p" ] && git rm -rq --ignore-unmatch "$p"; done < .delete-list
            rm -f .delete-list
          fi
          msg=$(cat .bundle-msg 2>/dev/null || echo "Aggiornamento")
          rm -f .bundle-msg
          git config user.name "NavMaster bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed=$(git diff --cached --name-only)
          echo "$changed"
          git commit -q -m "$msg" || echo "nessuna modifica"
          # someone (the web editor) may have pushed meanwhile
          git pull -q --rebase origin main
          git push
          app=$(echo "$changed" | grep -vqE '^(docs/|data/|inbox/|\.github/workflows/dati\.yml|[^/]*\.md$)' && echo 1 || echo 0)
          dati=$(echo "$changed" | grep -qE '^(data/|\.github/workflows/dati\.yml)' && echo 1 || echo 0)
          [ "$runapp" = 1 ] && app=1
          [ -n "$regions" ] && dati=1
          echo "app=$app" >> $GITHUB_OUTPUT
          echo "dati=$dati" >> $GITHUB_OUTPUT
          echo "regions=${regions:-romania,italy,test}" >> $GITHUB_OUTPUT
          echo "first=$( [ -f .first-run ] && echo 1 || echo 0)" >> $GITHUB_OUTPUT
      - name: Avvia la build dell'app
        if: steps.u.outputs.app == '1'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run app.yml --ref main
      - name: Avvia la preparazione dei dati offline
        if: steps.u.outputs.dati == '1'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run dati.yml --ref main -f region=${{ steps.u.outputs.regions }}
