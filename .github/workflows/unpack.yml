# Changes arrive as one packed file (inbox/*.b64 = base64 of a .tar.gz of the changed files):
# this workflow unpacks it into the repository, commits, and starts the builds concerned.
name: Scompatta pacchetto

on:
  push:
    branches: [main]
    paths: ["inbox/**"]

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Scompatta e committa
        id: u
        run: |
          set -e
          shopt -s nullglob
          files=(inbox/*.b64)
          [ ${#files[@]} -eq 0 ] && { echo "niente da scompattare"; exit 0; }
          msg=""
          for f in "${files[@]}"; do
            tr -d ' \n\r' < "$f" | base64 -d | tar -xz -C .
            git rm -q "$f"
          done
          if [ -f .delete-list ]; then
            while read -r p; do [ -n "$p" ] && git rm -rq --ignore-unmatch "$p"; done < .delete-list
            rm -f .delete-list
          fi
          msg=$(cat .bundle-msg 2>/dev/null || echo "Aggiornamento")
          rm -f .bundle-msg
          git config user.name "NavMaster bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed=$(git diff --cached --name-only)
          echo "$changed"
          git commit -q -m "$msg" || { echo "nessuna modifica"; exit 0; }
          git push
          echo "app=$(echo "$changed" | grep -vqE '^(docs/|data/|inbox/|\.github/workflows/dati\.yml|[^/]*\.md$)' && echo 1 || echo 0)" >> $GITHUB_OUTPUT
          echo "dati=$(echo "$changed" | grep -qE '^(data/(build_limits\.py)|\.github/workflows/dati\.yml)' && echo 1 || echo 0)" >> $GITHUB_OUTPUT
          echo "first=$( [ -f .first-run ] && echo 1 || echo 0)" >> $GITHUB_OUTPUT
      - name: Avvia la build dell'app
        if: steps.u.outputs.app == '1'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run app.yml --ref main
      - name: Avvia la preparazione dei dati offline
        if: steps.u.outputs.dati == '1'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run dati.yml --ref main -f region=entrambe
